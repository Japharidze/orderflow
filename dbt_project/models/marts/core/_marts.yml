version: 2

models:
  - name: fct_order_lines
    description: One row per order line.
    columns:
      - name: orderline_id
        data_tests:
          - unique
          - not_null
      - name: company_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
  - name: fct_web_requests
    description: One row per web request.
    columns:
      - name: company_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_id
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: device_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['desktop', 'mobile', 'tablet', 'bot']
  - name: dim_company
    description: One row per company.
    columns:
      - name: company_id
        data_tests:
          - unique
          - not_null
      - name: username
        data_tests:
          - unique
  - name: dim_product
    description: One row per product.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
  - name: dim_date 
    description: One row per date.
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null