[project]
name = "orderflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.5",
    "faker>=40.36.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwh"]
